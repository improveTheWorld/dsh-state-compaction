# Bundle autonome de compaction d'état (@local/dsh-state-compaction)
# Monté au niveau Host dans un domaine isolé et interceptant automatiquement
# tous les moteurs de compaction des presets (Standard, PTC, Scalpel, Quorum, Creator).
- insert:
    - id: state-compaction-host
      name: cordis:group
      group: true
      isolate:
        compaction: true
      config:
        - id: dsh-state-compaction
          name: '@local/dsh-state-compaction'
          config:
            summarizationProvider: antigrav
            summarizationModel: claude-fable-5-dd-hgih-hsalf-8.3-inimeg
            archivist:
              enabled: true
              fallback: true